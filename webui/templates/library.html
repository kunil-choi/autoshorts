<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>autoshorts - 검토함</title>
  <style>
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; color: #444; margin-top: 28px; }
    p.hint { font-size: 13px; color: #666; }
    .item {
      display: flex; gap: 12px; align-items: flex-start; border: 1px solid #ddd; border-radius: 8px;
      padding: 12px; margin-bottom: 10px;
    }
    .item .body { flex: 1; min-width: 0; }
    .item .badge {
      display: inline-block; font-size: 11px; background: #eef4ff; color: #2563eb;
      padding: 1px 8px; border-radius: 10px; margin-bottom: 4px;
    }
    .item .title { font-weight: 600; margin-bottom: 4px; }
    .item .summary { font-size: 13px; color: #555; margin-bottom: 6px; }
    .item .meta { font-size: 12px; color: #888; margin-bottom: 8px; }
    .item .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .item .actions a, .item .actions button {
      font-size: 13px; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc;
      background: white; cursor: pointer; text-decoration: none; color: #333;
    }
    .item .actions .publish-btn { border-color: #16a34a; color: #16a34a; }
    .item .actions .publish-btn:hover { background: #f0fdf4; }
    .item .actions .delete-btn { border-color: #dc2626; color: #dc2626; }
    .item .actions .delete-btn:hover { background: #fef2f2; }
    .item.done { opacity: 0.6; }
    .item .status-label { font-size: 12px; font-weight: 600; }
    .status-label.public { color: #16a34a; }
    .status-label.deleted { color: #dc2626; }
    #empty { color: #888; font-size: 14px; }
    .src-card { border: 1px solid #d9dce3; border-left: 5px solid #16a34a; border-radius: 8px;
      padding: 8px 12px; margin-bottom: 8px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
    .src-card.warn { border-left-color: #f59e0b; background: #fffbeb; }
    .src-card.idle { border-left-color: #059669; }
    .src-card a { margin-left: auto; font-size: 13px; font-weight: 700; color: #6d28d9; text-decoration: none; }
    #filters { margin: 8px 0 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    #filters button { border: 1px solid #ccc; background: white; border-radius: 14px; padding: 3px 12px;
      font-size: 12px; cursor: pointer; }
    #filters button.on { background: #6d28d9; border-color: #6d28d9; color: white; }
    #status-msg { margin: 10px 0; padding: 8px; border-radius: 6px; display: none; font-size: 13px; }
    #status-msg.error { display: block; background: #fde2e2; }
    a.home-link { font-size: 13px; }
  </style>
</head>
<body>
  {% set active = 'library' %}{% include '_nav.html' %}

  <div id="source-cards"></div>
  <div id="status-msg"></div>

  <h2>검토 대기 중</h2>
  <p class="hint">확인 후 공개할 것만 "공개로 전환"을 누르고, 안 쓸 것은 "삭제"하세요.</p>
  <div id="filters"></div>
  <div id="pending-items"></div>
  <div id="empty" style="display:none">아직 생성된 쇼츠가 없습니다.</div>

  <h2>처리 완료</h2>
  <div id="done-items"></div>

  <script>
    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function setStatusMsg(msg, isError) {
      const el = document.getElementById('status-msg');
      el.textContent = msg || '';
      el.classList.toggle('error', !!isError);
      el.style.display = msg ? 'block' : 'none';
    }

    function renderPendingItem(item) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="body">
          <span class="badge">${item.source_label || ''}</span>
          <div class="title">${item.title}</div>
          <div class="summary">${item.summary || ''}</div>
          <div class="meta">${fmtDate(item.created_at)}</div>
          <div class="actions">
            <a href="${item.youtube_url}" target="_blank" rel="noopener">유튜브에서 보기</a>
            <button type="button" class="publish-btn">공개로 전환</button>
            <button type="button" class="delete-btn">삭제</button>
          </div>
        </div>
      `;
      div.querySelector('.publish-btn').addEventListener('click', () => doAction(item.id, 'publish', item.video_id));
      div.querySelector('.delete-btn').addEventListener('click', () => doAction(item.id, 'delete', item.video_id));
      return div;
    }

    function renderDoneItem(item) {
      const div = document.createElement('div');
      div.className = 'item done';
      const label = item.status === 'public'
        ? '<span class="status-label public">공개됨</span>'
        : '<span class="status-label deleted">삭제됨</span>';
      div.innerHTML = `
        <div class="body">
          <span class="badge">${item.source_label || ''}</span>
          <div class="title">${item.title}</div>
          <div class="meta">${fmtDate(item.created_at)} · ${label}
            ${item.status === 'public' ? ` · <a href="${studioUrl(item.video_id)}" target="_blank" rel="noopener">스튜디오에서 열기</a>` : ''}</div>
        </div>
      `;
      return div;
    }

    function studioUrl(videoId) {
      return `https://studio.youtube.com/video/${videoId}/edit`;
    }

    async function doAction(itemId, action, videoId) {
      const verb = action === 'publish' ? '공개 전환' : '삭제';
      if (action === 'delete' && !confirm(`정말 삭제할까요? 유튜브에서도 영상이 삭제됩니다.\n(${verb})`)) return;
      setStatusMsg(`${verb} 처리 중...`, false);
      // Open the tab right now, inside the click, because browsers block
      // window.open() once we've awaited the network call below.
      const studioWin = action === 'publish' ? window.open('', '_blank') : null;
      try {
        const res = await fetch(`/library/items/${itemId}/${action}`, { method: 'POST' });
        if (!res.ok) {
          let text = await res.text();
          try { text = JSON.parse(text).detail || text; } catch (e) { /* 이미 일반 문구 */ }
          throw new Error(text);
        }
        if (studioWin) studioWin.location = studioUrl(videoId);
        setStatusMsg(action === 'publish'
          ? '공개 전환 완료! 열린 유튜브 스튜디오 탭에서 권리관리 정책(Monetize-worldwide)과 수익창출을 설정하세요.'
          : '', false);
        await load();
      } catch (err) {
        if (studioWin) studioWin.close();
        setStatusMsg(`${verb} 실패: ` + err.message, true);
      }
    }

    let activeSource = '';

    function renderFilters(pending) {
      const el = document.getElementById('filters');
      const labels = [...new Set(pending.map(it => it.source_label).filter(Boolean))];
      el.innerHTML = '';
      if (labels.length < 2) { activeSource = ''; return; }
      [['', `전체 ${pending.length}`], ...labels.map(l => [l, `${l} ${pending.filter(it => it.source_label === l).length}`])]
        .forEach(([value, text]) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = text;
          btn.className = value === activeSource ? 'on' : '';
          btn.onclick = () => { activeSource = value; load(); };
          el.appendChild(btn);
        });
    }

    async function loadSourceCards() {
      try {
        const data = await (await fetch('/auto/summary')).json();
        const el = document.getElementById('source-cards');
        el.innerHTML = '';
        data.sources.forEach(src => {
          const div = document.createElement('div');
          let text, cls = 'src-card';
          if (src.made_today > 0) {
            text = `✅ 오늘 ${src.made_today}개 생성`;
          } else if (!src.scheduled) {
            text = '오늘 아직 없음'; cls += ' idle';
          } else if (src.scheduler_result === 'processing') {
            text = '⏳ 자동 생성 중...';
          } else {
            text = '⚠️ 오늘 자동 생성 없음'; cls += ' warn';
          }
          div.className = cls;
          div.innerHTML = `<b>${src.scheduled ? '📻' : '💰'} ${src.name}</b> ${text}
            <a href="/auto">${src.made_today > 0 ? '자동 생성 화면' : (src.scheduled ? '지금 실행 →' : '링크 넣고 실행 →')}</a>`;
          el.appendChild(div);
        });
      } catch (e) { /* 상태 카드가 없어도 검토 목록은 보여야 함 */ }
    }

    async function load() {
      loadSourceCards();
      const res = await fetch('/library/items');
      const data = await res.json();
      const items = data.items || [];

      const pendingEl = document.getElementById('pending-items');
      const doneEl = document.getElementById('done-items');
      pendingEl.innerHTML = '';
      doneEl.innerHTML = '';

      const allPending = items.filter(it => it.status === 'private');
      renderFilters(allPending);
      const pending = activeSource ? allPending.filter(it => it.source_label === activeSource) : allPending;
      const done = items.filter(it => it.status !== 'private');

      document.getElementById('empty').style.display = items.length ? 'none' : 'block';
      if (!pending.length) {
        pendingEl.innerHTML = '<p class="hint">검토 대기 중인 쇼츠가 없습니다.</p>';
      } else {
        pending.forEach(item => pendingEl.appendChild(renderPendingItem(item)));
      }
      done.forEach(item => doneEl.appendChild(renderDoneItem(item)));
    }

    load();
  </script>
  <script src="/static/notify.js"></script>
</body>
</html>
