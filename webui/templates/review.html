<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>autoshorts - 리뷰</title>
  <style>
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; padding: 16px; }
    h2 { margin: 4px 0 12px; font-size: 16px; }
    .top-row { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
    #player-frame, #upload-player { width: 380px; height: 214px; background: #000; flex: 0 0 380px; }
    .title-controls { display: flex; flex-direction: column; gap: 10px; align-self: center; }
    .title-controls h1 { margin: 0; font-size: 20px; }
    .player-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .player-controls button {
      padding: 6px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px;
      background: white; cursor: pointer;
    }
    .player-controls button:hover { border-color: #93b4e6; }
    #play-btn { min-width: 84px; font-weight: 600; }
    .seek-buttons { display: flex; gap: 6px; }
    .candidates { margin-bottom: 20px; }
    .candidate-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .candidate-row-label { flex: 0 0 90px; font-size: 13px; color: #555; font-weight: 600; }
    .candidate-tiles { display: flex; gap: 8px; flex-wrap: wrap; }
    .candidate-tile {
      width: 44px; height: 44px; border: 1px solid #ccc; border-radius: 6px; background: white;
      cursor: pointer; font-size: 15px; font-weight: 600; color: #444;
    }
    .candidate-tile:hover { border-color: #93b4e6; }
    .candidate-tile.selected { background: #2563eb; border-color: #2563eb; color: white; }
    #candidate-detail { margin-top: 8px; padding: 8px 10px; background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 6px; font-size: 13px; }
    #candidate-detail .empty { color: #888; }
    #candidate-detail .tier { display: inline-block; font-size: 11px; background: #eee; padding: 1px 6px; border-radius: 10px; margin-bottom: 4px; }
    .segments { max-height: 380px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; }
    .segment { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; }
    .segment:hover { background: #f7f7f7; }
    .segment.selected { background: #dbeafe; }
    .segment .t { color: #888; font-size: 12px; margin-right: 8px; }
    .segment .speaker { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 10px; margin-right: 6px; }
    .segment .speaker.anchor { background: #e0edff; color: #1d4ed8; }
    .segment .speaker.panel { background: #fde8e8; color: #b91c1c; }
    #selection-preview { margin-top: 10px; padding: 8px 10px; background: #f7f9fc; border: 1px solid #dbe4f0; border-radius: 6px; font-size: 13px; }
    #selection-preview .empty { color: #888; }
    #selection-preview .range { margin-bottom: 6px; }
    #selection-preview .range:last-child { margin-bottom: 0; }
    #selection-preview .range .t { color: #2563eb; font-weight: 600; font-size: 12px; margin-right: 6px; }
    #selection-preview .total { margin-top: 6px; color: #666; font-size: 12px; }
    .actions { margin: 12px 0; }
    button.primary { padding: 8px 16px; font-size: 15px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button.primary:disabled { background: #aaa; }
    #build-section, #final-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid #ddd; display: none; }
    .caption-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .caption-row .t { flex: 0 0 110px; color: #888; font-size: 12px; }
    .caption-row input { flex: 1; }
    #status { margin: 10px 0; padding: 8px; background: #f2f2f2; border-radius: 6px; }
    #status.error { background: #fde2e2; }
    #status:empty { display: none; }
    .field { margin: 10px 0; }
    .field label { display: block; margin-bottom: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="top-row">
    {% if is_youtube %}
      <div id="player-frame">
        <div id="yt-player"></div>
      </div>
    {% else %}
      <video id="upload-player" controls src="/jobs/{{ job_id }}/source-media"></video>
    {% endif %}
    <div class="title-controls">
      <h1>{{ video_title }}</h1>
      <div class="player-controls">
        <button type="button" id="play-btn" onclick="togglePlay()">▶ 재생</button>
        <div class="seek-buttons">
          <button type="button" onclick="seekRelative(-10)">-10초</button>
          <button type="button" onclick="seekRelative(-5)">-5초</button>
          <button type="button" onclick="seekRelative(5)">+5초</button>
          <button type="button" onclick="seekRelative(10)">+10초</button>
        </div>
      </div>
    </div>
  </div>

  <div class="candidates">
    <h2>3-4. AI 추천 후보 (번호를 클릭하면 아래 자막에서 해당 구간이 선택됩니다)</h2>
    <div id="candidate-grid"></div>
    <div id="candidate-detail"><div class="empty">후보 번호를 클릭하면 여기에 요약이 표시됩니다.</div></div>
  </div>

  <h2>5-6. 자막에서 쇼츠로 만들 구간을 클릭해서 선택하세요 (여러 구간 선택 가능, 하드컷으로 이어붙여집니다)</h2>
  <div class="segments" id="segments"></div>

  <div id="selection-preview"></div>

  <div class="actions">
    <button class="primary" id="build-draft-btn" onclick="buildDraft()">7. 초안 만들기</button>
  </div>

  <div id="status"></div>

  <div id="build-section">
    <h2>7. 초안 확인 - 자막 오타를 수정하세요</h2>
    <video id="draft-player" controls style="width:100%;max-width:480px"></video>
    <div id="caption-editor"></div>
  </div>

  <div id="final-section">
    <h2>8. 메타데이터</h2>
    <div class="field">
      <label>썸네일 문구 (2줄, 줄바꿈으로 구분)</label>
      <textarea id="thumbnail_text" rows="2" style="width:100%"></textarea>
    </div>
    <div class="field">
      <label>출연자 이름</label>
      <input type="text" id="guest_label" style="width:100%" value="{{ guest_label_guess }}">
    </div>
    <div class="field">
      <label>좌상단 로고 이미지</label>
      <input type="file" id="logo_top_left" accept="image/*">
    </div>
    <div class="field">
      <label>우상단 로고 이미지</label>
      <input type="file" id="logo_top_right" accept="image/*">
    </div>
    <div class="field">
      <label>하단 이미지</label>
      <input type="file" id="banner_bottom" accept="image/*">
    </div>
    <button class="primary" onclick="renderFinal()">9. 최종 렌더링</button>

    <div id="final-result" style="margin-top:16px"></div>
  </div>

  <script>
    const jobId = {{ job_id | tojson }};
    const isYoutube = {{ is_youtube | tojson }};
    const youtubeId = {{ youtube_id | tojson }};
    const segments = {{ segments_json | safe }};
    const candidates = {{ candidates_json | safe }};
    let currentBuildId = null;

    // real YouTube IFrame API player (not a raw iframe src) so we can read
    // back the exact current playback position for the -10/-5/+5/+10 buttons,
    // which a plain postMessage-only embed can't give us reliably.
    let ytPlayer = null;
    let ytReady = false;

    if (isYoutube) {
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = function() {
        ytPlayer = new YT.Player('yt-player', {
          width: 380, height: 214, videoId: youtubeId,
          playerVars: { rel: 0 },
          events: {
            onReady: () => { ytReady = true; },
            onStateChange: (e) => {
              document.getElementById('play-btn').textContent =
                e.data === YT.PlayerState.PLAYING ? '⏸ 일시정지' : '▶ 재생';
            },
          },
        });
      };
    } else {
      window.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('upload-player');
        video.addEventListener('play', () => { document.getElementById('play-btn').textContent = '⏸ 일시정지'; });
        video.addEventListener('pause', () => { document.getElementById('play-btn').textContent = '▶ 재생'; });
      });
    }

    function getCurrentTime() {
      if (isYoutube) return ytReady ? ytPlayer.getCurrentTime() : 0;
      return document.getElementById('upload-player').currentTime;
    }

    function seekRelative(delta) {
      seekTo(getCurrentTime() + delta);
    }

    function togglePlay() {
      if (isYoutube) {
        if (!ytReady) return;
        if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
        else ytPlayer.playVideo();
      } else {
        const video = document.getElementById('upload-player');
        if (video.paused) video.play(); else video.pause();
      }
    }

    function fmt(sec) {
      sec = Math.round(sec);
      const m = Math.floor(sec / 60), s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // speaker is Claude's best-effort guess (analyze.label_speakers) from
    // conversational pattern, not real audio diarization - empty when it
    // couldn't tell (solo narration, labeling failed, etc.), so no badge.
    function speakerBadge(speaker) {
      if (speaker === '앵커') return '<span class="speaker anchor">앵커</span>';
      if (speaker === '패널') return '<span class="speaker panel">패널</span>';
      return '';
    }

    const segmentsEl = document.getElementById('segments');
    segments.forEach((seg, i) => {
      const div = document.createElement('div');
      div.className = 'segment';
      div.dataset.idx = i;
      div.innerHTML = `<span class="t">${fmt(seg.start_sec)}-${fmt(seg.end_sec)}</span>${speakerBadge(seg.speaker)}${seg.text}`;
      div.addEventListener('click', () => {
        div.classList.toggle('selected');
        seekTo(seg.start_sec);
        updateSelectionPreview();
      });
      segmentsEl.appendChild(div);
    });
    updateSelectionPreview();
    renderCandidateGrid();

    function seekTo(sec) {
      sec = Math.max(0, sec);
      if (isYoutube) {
        if (!ytReady) return;
        ytPlayer.seekTo(sec, true);
        ytPlayer.playVideo();
      } else {
        const video = document.getElementById('upload-player');
        video.currentTime = sec;
        video.play();
      }
    }

    // group candidates by tier, preserving first-seen tier order (hook,
    // then substantive, then custom - whichever tiers actually ran) - the
    // worker sees them as separate numbered rows (1-5 hook / 1-5 content /
    // ...) matching how analyze.py generates them, rather than one mixed
    // 1-10 list.
    function groupCandidatesByTier() {
      const order = [];
      const groups = {};
      candidates.forEach((c, idx) => {
        if (!groups[c.tier]) { groups[c.tier] = { label: c.tier_label, items: [] }; order.push(c.tier); }
        groups[c.tier].items.push({ ...c, _idx: idx });
      });
      return order.map(tier => groups[tier]);
    }

    function renderCandidateGrid() {
      const grid = document.getElementById('candidate-grid');
      grid.innerHTML = '';
      if (!candidates.length) {
        grid.innerHTML = '<p>추천 후보가 없습니다.</p>';
        return;
      }
      groupCandidatesByTier().forEach(group => {
        const row = document.createElement('div');
        row.className = 'candidate-row';
        row.innerHTML = `<div class="candidate-row-label">${group.label}</div>`;
        const tiles = document.createElement('div');
        tiles.className = 'candidate-tiles';
        group.items.forEach((c, i) => {
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'candidate-tile';
          tile.dataset.idx = c._idx;
          tile.textContent = i + 1;
          tile.addEventListener('click', () => selectCandidate(c._idx));
          tiles.appendChild(tile);
        });
        row.appendChild(tiles);
        grid.appendChild(row);
      });
    }

    function selectCandidate(idx) {
      const cand = candidates[idx];

      document.querySelectorAll('.candidate-tile').forEach(el =>
        el.classList.toggle('selected', parseInt(el.dataset.idx) === idx));
      document.getElementById('candidate-detail').innerHTML = `
        <span class="tier">${cand.tier_label}</span>
        <div><strong>${cand.title}</strong></div>
        <div>${cand.summary}</div>`;

      document.querySelectorAll('.segment').forEach(el => el.classList.remove('selected'));
      cand.ranges.forEach(r => {
        segments.forEach((seg, i) => {
          if (seg.end_sec > r.start_sec && seg.start_sec < r.end_sec) {
            segmentsEl.children[i].classList.add('selected');
          }
        });
      });
      document.getElementById('thumbnail_text').value = cand.thumbnail_text || '';
      if (cand.ranges.length) seekTo(cand.ranges[0].start_sec);
      updateSelectionPreview();
    }

    function selectedRanges() {
      const selectedIdx = [...document.querySelectorAll('.segment.selected')]
        .map(el => parseInt(el.dataset.idx)).sort((a,b) => a-b);
      const ranges = [];
      let start = null, prev = null;
      for (const i of selectedIdx) {
        if (start === null) { start = segments[i].start_sec; }
        else if (prev !== i - 1) {
          ranges.push([start, segments[prev].end_sec]);
          start = segments[i].start_sec;
        }
        prev = i;
      }
      if (start !== null) ranges.push([start, segments[prev].end_sec]);
      return ranges;
    }

    function textForRange(startSec, endSec) {
      return segments
        .filter(seg => seg.end_sec > startSec && seg.start_sec < endSec)
        .map(seg => seg.text)
        .join(' ');
    }

    function updateSelectionPreview() {
      const el = document.getElementById('selection-preview');
      const ranges = selectedRanges();
      if (!ranges.length) {
        el.innerHTML = '<div class="empty">선택된 구간이 없습니다. 위 자막을 클릭해서 선택하세요.</div>';
        return;
      }
      const rangeHtml = ranges.map(([start, end]) =>
        `<div class="range"><span class="t">${fmt(start)}-${fmt(end)}</span>${textForRange(start, end)}</div>`
      ).join('');
      const totalSec = ranges.reduce((sum, [start, end]) => sum + (end - start), 0);
      el.innerHTML = rangeHtml +
        `<div class="total">${ranges.length}개 구간 선택됨 · 합계 ${fmt(totalSec)}</div>`;
    }

    function setStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg || '';
      el.classList.toggle('error', !!isError);
    }

    async function buildDraft() {
      const ranges = selectedRanges();
      if (!ranges.length) { setStatus('구간을 먼저 선택하세요.', true); return; }

      const formData = new FormData();
      formData.append('ranges', JSON.stringify(ranges));
      setStatus('구간 추출 중...');
      const res = await fetch(`/jobs/${jobId}/builds`, { method: 'POST', body: formData });
      if (!res.ok) { setStatus('오류: ' + await res.text(), true); return; }
      const data = await res.json();
      currentBuildId = data.build_id;
      pollBuild();
    }

    async function pollBuild() {
      const res = await fetch(`/builds/${currentBuildId}`);
      const data = await res.json();
      setStatus(data.message || data.status);
      if (data.status === 'draft_ready') {
        document.getElementById('build-section').style.display = 'block';
        document.getElementById('final-section').style.display = 'block';
        document.getElementById('draft-player').src = `/builds/${currentBuildId}/draft.mp4`;
        renderCaptionEditor(data.cues);
      } else if (data.status === 'error') {
        // status already shown as error
      } else {
        setTimeout(pollBuild, 2000);
      }
    }

    function renderCaptionEditor(cues) {
      const el = document.getElementById('caption-editor');
      el.innerHTML = '';
      cues.forEach((cue, i) => {
        const row = document.createElement('div');
        row.className = 'caption-row';
        row.innerHTML = `<span class="t">${fmt(cue[0])}-${fmt(cue[1])}</span>
          <input type="text" data-idx="${i}" value="${cue[2].replace(/"/g, '&quot;')}">`;
        el.appendChild(row);
      });
      el.dataset.cues = JSON.stringify(cues);
    }

    async function renderFinal() {
      const cues = JSON.parse(document.getElementById('caption-editor').dataset.cues || '[]');
      const inputs = document.querySelectorAll('#caption-editor input');
      const captions = cues.map((cue, i) => [cue[0], cue[1], inputs[i].value]);

      const formData = new FormData();
      formData.append('captions', JSON.stringify(captions));
      formData.append('thumbnail_text', document.getElementById('thumbnail_text').value);
      formData.append('guest_label', document.getElementById('guest_label').value);
      for (const id of ['logo_top_left', 'logo_top_right', 'banner_bottom']) {
        const fileInput = document.getElementById(id);
        if (fileInput.files.length) formData.append(id, fileInput.files[0]);
      }

      setStatus('최종 렌더링 요청 중...');
      const res = await fetch(`/builds/${currentBuildId}/final`, { method: 'POST', body: formData });
      if (!res.ok) { setStatus('오류: ' + await res.text(), true); return; }
      pollFinal();
    }

    async function pollFinal() {
      const res = await fetch(`/builds/${currentBuildId}`);
      const data = await res.json();
      setStatus(data.message || data.status);
      if (data.status === 'done') {
        document.getElementById('final-result').innerHTML =
          `<video controls style="width:100%;max-width:480px" src="/builds/${currentBuildId}/final.mp4"></video>
           <p><a href="/builds/${currentBuildId}/final.mp4" download>완성된 쇼츠 다운로드</a></p>`;
      } else if (data.status === 'error') {
        // status already shown as error
      } else {
        setTimeout(pollFinal, 2000);
      }
    }
  </script>
</body>
</html>
