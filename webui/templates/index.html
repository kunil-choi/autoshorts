<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>autoshorts</title>
  <style>
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    fieldset { margin-bottom: 16px; padding: 12px; }
    label { display: block; margin: 6px 0; }
    #status { margin-top: 16px; padding: 10px; background: #f2f2f2; border-radius: 6px; display: none; }
    #status.error { background: #fde2e2; }
    button { padding: 8px 16px; font-size: 15px; }
  </style>
</head>
<body>
  <h1>autoshorts</h1>
  <p><a href="/library">🎬 쇼츠 라이브러리 (완전 자동으로 만든 쇼츠 검토/공개 전환)</a></p>
  <p>1단계: 링크 또는 원본 파일을 넣고, 분석 조건을 골라주세요.</p>

  <form id="job-form">
    <fieldset>
      <legend>1. 입력</legend>
      <label><input type="radio" name="source_type" value="url" checked> 유튜브 링크</label>
      <input type="text" name="url" placeholder="https://www.youtube.com/watch?v=..." style="width:100%">
      <label style="margin-top:10px"><input type="radio" name="source_type" value="upload"> 원본 파일 업로드</label>
      <input type="file" name="file" accept="video/*">
    </fieldset>

    <fieldset>
      <legend>3. 조건 선택</legend>
      <label><input type="checkbox" name="tiers" value="hook" checked> A. 훅이 강한 부분</label>
      <label><input type="checkbox" name="tiers" value="substantive" checked> B. 내용상 중요한 부분</label>
      <label>C. 직접 입력한 주제 (선택)
        <input type="text" name="custom_topic" placeholder="예: 금리 인상 관련 발언" style="width:100%">
      </label>
    </fieldset>

    <fieldset>
      <legend>4. 목표 길이</legend>
      <select name="clip_length">
        {% for preset in clip_length_presets %}
        <option value="{{ preset.key }}" {% if preset.key == default_clip_length %}selected{% endif %}>{{ preset.label }}</option>
        {% endfor %}
      </select>
    </fieldset>

    <button type="submit">분석 시작</button>

    <fieldset style="margin-top:20px;border-color:#7c3aed">
      <legend>🚀 완전 자동 모드</legend>
      <p style="font-size:13px;color:#666;margin-top:0">
        위 1번 입력과 4번 목표 길이만 그대로 쓰고, 아래 개수만 정하면 구간 선정부터
        자막 맞춤법 교정, 렌더링, 유튜브 <b>비공개</b> 업로드까지 사람 확인 없이 전부
        자동으로 진행합니다. (3번 조건 체크박스는 자동 모드에서는 쓰지 않고 훅+핵심내용
        후보를 함께 봅니다)
      </p>
      <label>프로그램 (중앙 하단 로고용, 선택):
        <select name="program_key">
          <option value="">선택 안함 (중앙 하단 로고 없음)</option>
          {% for program in programs %}
          <option value="{{ program.key }}">{{ program.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>만들 개수: <input type="number" name="count" min="1" max="10" value="3" style="width:60px"></label>
      <br>
      <button type="button" id="auto-submit-btn" style="margin-top:10px;background:#7c3aed;color:white;border:none;border-radius:6px;padding:8px 16px;font-size:15px;cursor:pointer">
        🚀 완전 자동으로 진행 (비공개 업로드까지)
      </button>
    </fieldset>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById('job-form');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.style.display = 'block';
      statusEl.classList.remove('error');
      statusEl.textContent = '작업을 시작합니다...';

      const formData = new FormData(form);
      let jobId;
      try {
        const res = await fetch('/jobs', { method: 'POST', body: formData });
        if (!res.ok) throw new Error(await res.text());
        ({ job_id: jobId } = await res.json());
      } catch (err) {
        statusEl.classList.add('error');
        statusEl.textContent = '오류: ' + err.message;
        return;
      }

      const poll = async () => {
        const res = await fetch(`/jobs/${jobId}`);
        const data = await res.json();
        statusEl.textContent = data.message || data.status;
        if (data.status === 'ready') {
          window.location.href = `/jobs/${jobId}/review`;
        } else if (data.status === 'error') {
          statusEl.classList.add('error');
        } else {
          setTimeout(poll, 2000);
        }
      };
      poll();
    });

    document.getElementById('auto-submit-btn').addEventListener('click', async () => {
      statusEl.style.display = 'block';
      statusEl.classList.remove('error');
      statusEl.textContent = '자동 작업을 시작합니다...';

      const formData = new FormData(form);
      let autoJobId;
      try {
        const res = await fetch('/auto-jobs', { method: 'POST', body: formData });
        if (!res.ok) throw new Error(await res.text());
        ({ auto_job_id: autoJobId } = await res.json());
      } catch (err) {
        statusEl.classList.add('error');
        statusEl.textContent = '오류: ' + err.message;
        return;
      }
      window.location.href = `/auto-jobs/${autoJobId}/view`;
    });
  </script>
</body>
</html>
