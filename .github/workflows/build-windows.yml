name: Build Windows app

# Builds the Windows one-click .exe (see installer/build.bat, which this
# mirrors minus the local .env/client_secret.json backup dance - a fresh
# CI runner never has those to begin with) on every push to main, and
# publishes the result as the "latest-build" GitHub release - a single,
# stable download link that always has the newest build, so a
# non-technical worker doesn't need Python or PyInstaller installed
# locally just to pick up a code change.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/download_ffmpeg.ps1

      - name: Build with PyInstaller
        run: pyinstaller installer/autoshorts.spec --distpath dist --workpath build --noconfirm

      - name: Assemble distributable folder
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force installer/ffmpeg_bin dist/autoshorts/ffmpeg_bin
          Copy-Item -Force webui/.env.example dist/autoshorts/.env.example
          Copy-Item -Recurse -Force default_assets dist/autoshorts/default_assets

      # Zip the folder's *contents* (not the autoshorts folder itself), so
      # extracting into an existing install folder overwrites it in place
      # instead of nesting a second autoshorts/ folder inside it. The zip
      # has no .env / client_secret.json / youtube_token.json / work/, so
      # overwriting never touches the user's own settings and data.
      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path dist/autoshorts/* -DestinationPath autoshorts-windows.zip

      - name: Publish rolling "latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 최신 빌드 (자동, ${{ github.sha }})
          body: |
            커밋 ${{ github.sha }} 기준으로 자동 빌드된 최신 버전입니다.

            **처음 설치**: 새 폴더(예: autoshorts)를 만들고 그 안에
            `autoshorts-windows.zip`의 압축을 풀어, `autoshorts.exe`를
            실행하세요 - Python이나 ffmpeg를 따로 설치할 필요 없습니다.
            `.env.example`을 `.env`로 복사해 API 키를 넣어야 합니다.

            **업데이트**: autoshorts 앱을 완전히 종료(작업 표시줄/트레이
            확인)한 뒤, 기존에 쓰던 폴더 안에 이 zip의 압축을 그대로 풀어
            "덮어쓰기"하면 됩니다. `.env`, `client_secret.json`,
            `youtube_token.json`, `work` 폴더(검토함 목록)는 zip에 들어
            있지 않아서 그대로 유지됩니다.
          prerelease: true
          files: autoshorts-windows.zip
